# Release: nas tags vX.Y.Z, gera o instalador (Linux amd64, com o código da tag e o quiz embutidos) e publica a
# release com o executável e o SHA256SUMS.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  instalador:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe precisa das tags
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum
      - name: Gerar o instalador
        run: scripts/gerar-instalador.sh --sem-docker
      - name: Incluir o instalar.sh e o instalar-remoto.sh com a versão
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # o script baixado da release usa esta versão para buscar e conferir o executável da mesma tag
          for s in instalar.sh instalar-remoto.sh; do
            sed 's/^VERSAO=""$/VERSAO="'"$TAG"'"/' "$s" > "dist/instalador/$s"
            grep -qx "VERSAO=\"$TAG\"" "dist/instalador/$s"
          done
          cd dist/instalador && sha256sum instalar.sh instalar-remoto.sh m2m-instalador-* > SHA256SUMS && cat SHA256SUMS
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/instalador/* --title "m2m $TAG" --notes "Instalador do m2m $TAG para Ubuntu e derivados (amd64).

          Numa máquina acessada por SSH, do seu computador (Linux ou macOS), um comando faz tudo, inclusive abrir o quiz e importar a CA nos seus navegadores:

          \`\`\`bash
          curl -fsSLO https://github.com/${{ github.repository }}/releases/download/$TAG/instalar-remoto.sh
          sh instalar-remoto.sh usuario@maquina
          \`\`\`

          Na própria máquina, baixe o instalar.sh e o SHA256SUMS numa pasta, confira e rode como o seu usuário. O script prepara a máquina (pede a senha do sudo no terminal só para o que precisar), baixa e confere o executável desta versão e abre o quiz:

          \`\`\`bash
          sha256sum -c SHA256SUMS --ignore-missing
          sh instalar.sh
          \`\`\`

          Passo a passo no README: https://github.com/${{ github.repository }}#instalação-limpa-ubuntu-e-derivados"
