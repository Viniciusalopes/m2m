# Release: nas tags vX.Y.Z, gera o instalador (Linux amd64, com o código da tag e o quiz embutidos) e publica a
# release com o executável e o SHA256SUMS.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  instalador:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe precisa das tags
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum
      - name: Gerar o instalador
        run: scripts/gerar-instalador.sh --sem-docker
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/instalador/* --title "m2m $TAG" --notes "Instalador do m2m $TAG para Ubuntu e derivados (amd64).

          Confira o download e execute como o seu usuário, sem sudo:

          \`\`\`bash
          sha256sum -c SHA256SUMS --ignore-missing
          chmod +x m2m-instalador-$TAG-linux-amd64
          ./m2m-instalador-$TAG-linux-amd64
          \`\`\`

          Passo a passo no README: https://github.com/${{ github.repository }}#instalação-limpa-ubuntu-e-derivados"
