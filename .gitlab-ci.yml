# Pipeline do m2m: lint → test-back → test-front → license-check → build-images → e2e (manual)
stages:
  - lint
  - test-back
  - test-front
  - license-check
  - build-images
  - e2e

default:
  interruptible: true

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  TESTCONTAINERS_HOST_OVERRIDE: docker

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository
    - .npm

lint-front:
  stage: lint
  image: node:24
  script:
    - cd front && npm ci && npm run lint

lint-compose:
  stage: lint
  image: docker:cli
  variables:
    POSTGRES_PASSWORD: ci
    RABBITMQ_PASSWORD: ci
    APP_SECRET_KEY: chave-de-ci-com-mais-de-16-caracteres
    GRAFANA_ADMIN_PASSWORD: ci
  script:
    - docker compose -f docker-compose.yml config -q
    - docker compose -f docker-compose.yml -f docker-compose.test.yml config -q

test-back:
  stage: test-back
  image: eclipse-temurin:25-jdk
  services:
    - name: docker:dind
      command: ["--tls=false"]
  script:
    - cd back && ./mvnw -B verify
  artifacts:
    when: always
    reports:
      junit: back/target/surefire-reports/TEST-*.xml
    paths:
      - back/target/site/jacoco/

test-front:
  stage: test-front
  image: node:24
  script:
    - cd front && npm ci && npx ng test --watch=false && npx ng build --configuration production

license-check:
  stage: license-check
  image: eclipse-temurin:25-jdk
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl >/dev/null
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash - >/dev/null && apt-get install -y -qq nodejs >/dev/null
    - cd front && npm ci && cd ..
  script:
    - ./scripts/gerar-third-party-notices.sh
  artifacts:
    paths:
      - THIRD-PARTY-NOTICES.md

build-images:
  stage: build-images
  image: docker:cli
  services:
    - name: docker:dind
      command: ["--tls=false"]
  script:
    - docker build -t m2m-db:ci db
    - docker build -t m2m-queue:ci queue
    - docker build -t m2m-back:ci back
    - docker build -t m2m-front:ci front

e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  services:
    - name: docker:dind
      command: ["--tls=false"]
  variables:
    POSTGRES_PASSWORD: ci-postgres
    RABBITMQ_PASSWORD: ci-rabbit
    APP_SECRET_KEY: chave-de-ci-com-mais-de-16-caracteres
    ADMIN_USERNAME: admin
    ADMIN_PASSWORD: Senha-E2E-CI-1234
    ADMIN_EMAIL: ci@exemplo.test
    E2E_BASE_URL: https://docker
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io docker-compose-v2 >/dev/null
    - docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait
  script:
    - cd e2e && npm ci && npx playwright test
  after_script:
    - docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
