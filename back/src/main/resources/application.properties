spring.application.name=m2m-back
server.port=8080
server.forward-headers-strategy=framework
spring.jackson.time-zone=America/Sao_Paulo

# Banco: o esquema é gerenciado pelo m2m-db-migrate (Flyway); o back apenas valida
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/m2m}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Fila
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}

# Actuator: só o necessário para o healthcheck
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Instalação (variáveis do .env)
m2m.admin.username=${ADMIN_USERNAME:admin}
m2m.admin.password=${ADMIN_PASSWORD:}
m2m.admin.email=${ADMIN_EMAIL:}
m2m.secret-key=${APP_SECRET_KEY:}

# Sessão: 30 min sem atividade; cookie seguro (HTTPS é imposto pelo nginx)
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=M2MSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Mensagens (e-mails) e idioma
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# OpenAPI (exige login)
springdoc.api-docs.path=/api/docs/openapi
springdoc.swagger-ui.path=/api/docs

# Máquina LOCAL (o host do m2m montado em /hostfs)
m2m.local.enabled=${M2M_LOCAL_ENABLED:false}
m2m.local.base-dir=${M2M_LOCAL_BASE_DIR:/hostfs}
m2m.local.roots=${HOST_ROOTS:/home}

# Fila de jobs: um consumidor, uma mensagem por vez (D9)
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
m2m.tmp-dir=${M2M_TMP_DIR:/var/lib/m2m-tmp}

# Transferências manuais: consumidores simultâneos da fila m2m.transfers (D22)
m2m.transfers.concurrency=${TRANSFER_CONCURRENCY:2}
