spring.application.name=m2m-back
server.port=8080
server.forward-headers-strategy=framework
spring.jackson.time-zone=America/Sao_Paulo

# Banco: o esquema é gerenciado pelo m2m-db-migrate (Flyway); o back apenas valida
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/m2m}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Fila
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}

# Actuator: só o necessário para o healthcheck
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
