# Mensagens do backend usadas fora da API (e-mails). A API devolve códigos; o texto é do front (D35).
email.assunto.notificacao=[m2m] {0}
email.assunto.teste=[m2m] E-mail de teste
email.corpo.teste=Este é um e-mail de teste do m2m - Machine To Machine. Se você o recebeu, a configuração de e-mail (SMTP) está correta.
email.rodape=Enviado automaticamente pelo m2m - Machine To Machine.

# Notificações (assunto e corpo). Os parâmetros entram como {chave}.
notificacao.JOB_FAILED.assunto=Job agendado falhou
notificacao.JOB_FAILED=O job {tipo} do perfil "{perfil}" falhou às {horario}. Motivo: {motivo}.
notificacao.JOB_INTERRUPTED.assunto=Job agendado interrompido
notificacao.JOB_INTERRUPTED=O job {tipo} do perfil "{perfil}" foi interrompido às {horario}.
notificacao.BACKUP_SUSPECT.assunto=Backup suspeito
notificacao.BACKUP_SUSPECT=O backup {arquivo} do perfil "{perfil}" tem {arquivos} arquivos contra {anteriores} no último backup aceito e ficou marcado como suspeito. Aceite-o ou exclua-o no m2m.
notificacao.BACKUP_CORRUPTED.assunto=Backup corrompido
notificacao.BACKUP_CORRUPTED=O backup {arquivo} do perfil "{perfil}" não confere com o manifesto e foi marcado como corrompido. Motivo: {motivo}.
notificacao.SYNC_AWAITING.assunto=Sincronização aguardando confirmação
notificacao.SYNC_AWAITING=A sincronização do perfil "{perfil}" para {destino} foi parada por uma proteção e aguarda a sua confirmação. Motivo: {motivo}.
notificacao.SYNC_ABORTED.assunto=Sincronização abortada
notificacao.SYNC_ABORTED=A sincronização agendada do perfil "{perfil}" para {destino} foi abortada por proteção. Motivo: {motivo}.
notificacao.DB_BACKUP_FAILED.assunto=Falha no backup do banco do m2m
notificacao.DB_BACKUP_FAILED=O backup diário do banco de dados do m2m falhou: {motivo}.
notificacao.IDENTITY_CHANGED.assunto=Identidade de servidor alterada
notificacao.IDENTITY_CHANGED=A identidade (impressão digital) do servidor da máquina {maquina} mudou. A conexão foi recusada até você confirmar a nova identidade. Nova: {fingerprint}.
notificacao.LOW_SPACE.assunto=Pouco espaço livre no armazenamento
notificacao.LOW_SPACE=O armazenamento {maquina}:{dir} tem apenas {percentual}% de espaço livre ({livre} livres de {total}).
