spring.flyway.enabled=true
spring.flyway.locations=filesystem:../db/migrations
m2m.admin.username=admin
m2m.admin.password=Senha-Admin-Teste-1
m2m.admin.email=admin@exemplo.test
m2m.secret-key=chave-mestra-de-teste-com-mais-de-16-caracteres
m2m.tmp-dir=target/test-tmp
# Máquina LOCAL nos testes: um "host" falso em target/test-hostfs/home
m2m.local.enabled=true
m2m.local.base-dir=target/test-hostfs
m2m.local.roots=/home
m2m.local.name=NOTEBOOK
m2m.mail.retry-delay-ms=100
# Vários contextos Spring dividem o banco e a fila: a recuperação na partida interromperia o trabalho de outro
# contexto. Os testes que precisam dela chamam recuperar() diretamente.
m2m.recuperacao.na-partida=false
