<main class="login">
  <mat-card appearance="outlined" class="card">
    <img class="logo" src="assets/brand/m2m-logo.svg" alt="m2m" />
    <h1>{{ 'app.nome' | transloco }}</h1>

    @if (expirada) {
      <p class="aviso" role="status">
        <mat-icon aria-hidden="true">schedule</mat-icon> {{ 'login.sessao-expirada' | transloco }}
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="entrar()">
      <mat-form-field appearance="outline">
        <mat-label>{{ 'login.usuario' | transloco }}</mat-label>
        <input matInput formControlName="username" autocomplete="username" autofocus />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'login.senha' | transloco }}</mat-label>
        <input
          matInput
          formControlName="password"
          [type]="mostrarSenha() ? 'text' : 'password'"
          autocomplete="current-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="mostrarSenha.set(!mostrarSenha())"
          [attr.aria-label]="'login.mostrar-senha' | transloco"
        >
          <mat-icon>{{ mostrarSenha() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (erro(); as e) {
        <p class="erro" role="alert">
          <mat-icon aria-hidden="true">error</mat-icon>
          {{ 'erro.' + e.codigo | transloco: e.parametros }}
        </p>
      }

      @if (enviando()) {
        <mat-progress-bar mode="indeterminate" />
      }
      <button mat-flat-button type="submit" [disabled]="form.invalid || enviando()">
        {{ 'login.entrar' | transloco }}
      </button>
    </form>
  </mat-card>
</main>
