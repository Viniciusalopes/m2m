# Topologia do m2m carregada na inicialização (D16); o entrypoint gera o arquivo com o usuário do ambiente
load_definitions = /etc/rabbitmq/definitions.generated.json
disk_free_limit.absolute = 500MB
# Jobs longos (backups grandes) mantêm a mensagem sem confirmação por horas: sem limite de 30 min
consumer_timeout = 604800000
